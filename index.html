<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ivan's Blog</title>
  <meta name="description" content="A personal blog of thoughts, photos, videos, links and notes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c2571a'/%3E%3Cpath d='M20 44h24M38 16a4 4 0 0 1 6 6L26 40l-8 2 2-8Z' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved theme before paint
    try { const t = localStorage.getItem('myblog.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="banner"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="brand">
        <span class="brand-title" id="brand-title">Ivan's Blog</span>
        <span class="brand-tag" id="brand-tag"></span>
      </a>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </header>
  <main id="main" class="wrap"></main>
  <footer class="site-footer wrap" id="footer"></footer>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="wrap">This blog needs JavaScript turned on.</p></noscript>
</body>
</html>
